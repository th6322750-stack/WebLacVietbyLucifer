<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Favicon. The full brand mark (bird + drum + star, stroked at 18/512) collapses into an
       unreadable blob below 32px, so this uses the Dong Son sun motif from the centre of that
       mark instead. Eight points rather than the twelve on the drum: at 16px, twelve points
       are about a pixel wide each and merge into a ring. Verified by rendering at 16/32/48
       and looking at them, not by assuming. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFCA4F"/>
      <stop offset=".6" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#C7A450"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0B0B0B"/>
  <path d="M256.0 70.0 L295.8 159.9 L387.5 124.5 L352.1 216.2 L442.0 256.0 L352.1 295.8 L387.5 387.5 L295.8 352.1 L256.0 442.0 L216.2 352.1 L124.5 387.5 L159.9 295.8 L70.0 256.0 L159.9 216.2 L124.5 124.5 L216.2 159.9 Z" fill="url(#g)"/>
  <circle cx="256" cy="256" r="46" fill="#0B0B0B"/>
</svg>
