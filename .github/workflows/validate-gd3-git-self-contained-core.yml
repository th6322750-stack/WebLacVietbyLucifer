name: Validate GD3 Git Self-Contained Core
on:
  push:
    branches: [chatgpt/gd3-git-self-contained-v1]
    paths:
      - '.github/workflows/validate-gd3-git-self-contained-core.yml'
      - 'scripts/reconstruct-git-self-contained.py'
      - 'scripts/validate-gd3-git-self-contained.py'
      - '.webby/GIT_BINARY_MANIFEST.json'
      - '.webby/MASTER_BINARY_AUTHORITY.json'
      - '.webby/MASTER_INDEX.json'
      - '.webby/ROUTE_IMPLEMENTATION_MAP.json'
      - '.webby/asset-manifest.json'
      - '.webby/asset-catalog.json'
      - '.webby/visual-master/gd1-v1/**'
      - 'assets/production/**'
permissions:
  contents: read
jobs:
  validate-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gd3-git-self-contained-v1
          fetch-depth: 0
      - name: Verify Git object database
        run: git fsck --full
      - name: Verify clone-only materialization
        run: python scripts/reconstruct-git-self-contained.py
      - name: Strict GĐ3 binary and authority validation
        run: python scripts/validate-gd3-git-self-contained.py
