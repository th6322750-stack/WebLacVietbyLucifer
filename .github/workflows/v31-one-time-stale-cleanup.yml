name: One-time webby v3.1 stale cleanup

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/v31-one-time-stale-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0

      - name: Normalize v3.1 active metadata and archive pre-v3.1 receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          # PROJECT_INTAKE: current transport/asset authority only; keep prior commit as provenance without a stale branch directive.
          p=Path('.webby/PROJECT_INTAKE.json')
          d=json.loads(p.read_text())
          d['assets']=['.webby/asset-manifest.json','.webby/ASSET_USAGE_MAP.json','public/assets','assets/production/masters']
          gh=d['environment']['github']
          prior=gh.pop('parentValidatedHead', None)
          gh.pop('parentValidatedBranch', None)
          if prior:
            gh['migrationProvenanceCommit']=prior
          d['environment']['assetTransport']['runtimeRule']='ASSET_MANIFEST_DESTINATION_PATHS_ARE_AUTHORITATIVE'
          d['environment']['drive']['role']='OPTIONAL_HUMAN_REVIEW_ARCHIVE_ONLY'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          # Migration audit: replace stale in-progress findings with current preapproval truth.
          audit={
            'schemaVersion':2,
            'protocolVersion':'3.1.0',
            'canonicalSkillCommit':'b805dfdab336ff3942c68bb0e20a9edb0a047a18',
            'taskMode':'NEW_REDESIGN',
            'auditStatus':'ASSET_COMPLETE_PREAPPROVAL_PASS_AWAITING_USER_ASSET_APPROVAL',
            'auditedAt':'2026-08-17T07:57:00+07:00',
            'baseline':{
              'migrationProvenanceCommit':'09ad912eb5728395bafce96025734e4ac0491047',
              'approvedPdfSha256':'f015b20da10eb50862eec6bc9acc7668c02cd2746e31f29bdd73596319b60c4f',
              'userVisualApproval':'DUYỆT GIAO DIỆN V1'
            },
            'v31GateAudit':{
              'taskRouter':'PASS_NEW_REDESIGN',
              'projectIntake':'PASS',
              'assetCountPlan':'PASS_REPORTED_84',
              'assetManifest':'PASS_MATERIALIZED_GIT',
              'assetTransport':'PASS_GIT_NO_DRIVE_SESSION_PROOF_REQUIRED',
              'iconInventory':'PASS_40_UI_ICONS_PLUS_10_BRAND_MARKS',
              'motionAuthoritySplit':'PASS_FEEL_CHATGPT_MECHANISM_CLAUDE',
              'highResMasters':'PASS_7_4K_PLUS_26_NEW_FHD_AND_CANONICAL_LOGO_EXCEPTION',
              'mapping':'PASS',
              'canonicalPreapprovalValidator':'PASS',
              'implementationReadyUi':False,
              'onlyRemainingGate':'USER_ASSET_V3_1_APPROVAL_THEN_FINAL_READY_VALIDATION'
            },
            'assetAuthority':{
              'logicalAssetCount':84,
              'rasterLogicalCount':34,
              'vectorCount':50,
              'runtimeRoot':'public/assets',
              'manifest':'.webby/asset-manifest.json'
            },
            'legacyDeliveryEvidence':{
              'status':'PROVENANCE_ONLY_SUPERSEDED',
              'note':'The earlier small delivery/reference pack is retained only in Git history/provenance. It is not current v3.1 asset authority.'
            },
            'nextGateWork':[
              'user reviews ASSET_REVIEW_BOARD_V31.md',
              'record DUYỆT ASSET V3.1 receipt',
              'promote HANDOFF to IMPLEMENTATION_READY_UI',
              'run canonical v3.1 validator plus stale-authority audit on latest remote HEAD',
              'only after both pass set UI_SETUP_COMPLETE=true and implementationAuthorized=true'
            ]
          }
          Path('.webby/V3_1_MIGRATION_AUDIT.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n')

          # Current implementation artifact protocol. No old branch or legacy phase directives.
          Path('.webby/IMPLEMENTATION_ARTIFACT_PROTOCOL.md').write_text('''# webbyLucifer v3.1 implementation artifact protocol\n\nStatus: **ACTIVE v3.1**.\n\nThe implementation handoff is self-contained in Git on `chatgpt/webby-v3.1-implementation-ready`. Google Drive is review/archive only and is not an implementation dependency.\n\n## Runtime asset authority\n\n- `.webby/asset-manifest.json` — 84 logical assets and exact `destinationPath` mappings.\n- `.webby/ASSET_USAGE_MAP.json` — route/component usage mapping.\n- `public/assets` — materialized runtime files.\n- `assets/production/masters` — authoritative high-resolution raster masters.\n- `assets/production/vectors` — pinned UI/brand vectors.\n- `assets/production/brand/lac-viet-logo-source.png` — canonical logo source.\n\n## Visual authority\n\n- `.webby/visual-master/gd1-v1/LacVietMedia_GD1_UI_Approved_v1.pdf`\n- `.webby/visual-master/gd1-v1/pages/`\n- `.webby/MASTER_INDEX.json`\n- `.webby/ROUTE_IMPLEMENTATION_MAP.json`\n\n## Gate\n\nClaude must not code until `.webby/UI_SETUP_COMPLETE` reports both `UI_SETUP_COMPLETE=true` and `implementationAuthorized=true`, and the final canonical v3.1 validator passes on the same latest remote HEAD.\n\nDo not retrieve substitute assets, redraw the logo, redesign approved V1, infer missing icons, or use Drive to fill perceived gaps. If an active Git authority file/path/hash fails validation, stop and report the exact finding.\n''')

          # Old GĐ3 hardening checklist is historical, not current authority.
          Path('.webby/HARDENING_PREFLIGHT.md').write_text('''# Pre-v3.1 hardening preflight — SUPERSEDED / PROVENANCE ONLY\n\nThis file records an earlier pre-v3.1 handoff milestone and is **not active implementation authority**.\n\nCurrent authority is:\n\n- `.webby/HANDOFF.json`\n- `.webby/WEBBY_LOCK.json`\n- `.webby/asset-manifest.json`\n- `.webby/PROJECT_STATE.yaml`\n- `.webby/UI_SETUP_COMPLETE`\n- `.webby/CLAUDE_TASK.md`\n\nCurrent v3.1 asset truth is **84 logical assets** under Git transport. Drive is review/archive only. The current implementation gate remains blocked until user asset approval and final v3.1 validation.\n''')

          # DESIGN_SYSTEM wording: keep design lock, replace legacy phase names.
          p=Path('DESIGN_SYSTEM.md')
          s=p.read_text()
          old='Design System này là authority cho GĐ3/GĐ4 trừ khi Lucifer duyệt revision mới.'
          new='Design System này là authority cho deterministic spec và GĐ9 Implementation theo webbyLucifer v3.1, trừ khi người dùng duyệt revision mới.'
          if old not in s:
            raise SystemExit('EXPECTED_DESIGN_SYSTEM_LEGACY_SENTENCE_NOT_FOUND')
          p.write_text(s.replace(old,new,1))

          # Review-only preview docs: Git is primary; Drive links are mirrors only.
          p=Path('.webby/PREVIEW_AUTHORITY.md')
          if p.exists():
            s=p.read_text()
            if not s.startswith('> v3.1 status:'):
              s='> v3.1 status: **REVIEW MIRROR ONLY**. Git-resident PDF/page masters are implementation authority; external links below are optional human-review mirrors.\n\n'+s
            p.write_text(s)
          p=Path('.webby/visual-handoff/ui-states.md')
          if p.exists():
            s=p.read_text()
            s=s.replace('Drive: https://drive.google.com/file/d/1qLrhLzLHObagqDtA07aL5ITKrEFtChRh/view?usp=drivesdk','Git authority: `.webby/visual-master/gd1-v1/LacVietMedia_GD1_UI_Approved_v1.pdf`\nOptional review mirror: https://drive.google.com/file/d/1qLrhLzLHObagqDtA07aL5ITKrEFtChRh/view?usp=drivesdk')
            p.write_text(s)

          # Archive historical validation receipts instead of leaving them in active QA namespace.
          archive=Path('.webby/archive/pre-v31')
          archive.mkdir(parents=True, exist_ok=True)
          for src_name in [
            '.webby/qa/GD3_GIT_SELF_CONTAINED_VALIDATION.json',
            '.webby/qa/GD3_REMOTE_CLONE_VALIDATION.json',
            '.webby/GD3_CARRIER_RECEIPT.txt',
            '.webby/ARTIFACT_CHUNKS.json'
          ]:
            src=Path(src_name)
            if src.exists():
              dst=archive/src.name
              src.rename(dst)
          marker=archive/'README.md'
          marker.write_text('''# Pre-v3.1 provenance archive\n\nFiles in this directory are historical evidence only. They may describe earlier branches, asset counts or transport experiments that were true at that time. They are **not current implementation authority**.\n\nCurrent v3.1 truth: branch `chatgpt/webby-v3.1-implementation-ready`, 84 logical assets, Git transport, `public/assets` runtime root, Drive review/archive only, Claude blocked until user asset approval + final validator.\n''')
          PY

          # Remove obsolete workflows from the current tree; Git history preserves them.
          rm -f \
            .github/workflows/materialize-gd1-approved-pdf.yml \
            .github/workflows/materialize-canonical-logo-source.yml \
            .github/workflows/validate-gd3-git-self-contained-core.yml \
            .github/workflows/materialize-gd3-self-contained.yml \
            .github/workflows/materialize-gd3-carrier-v4.yml \
            .github/workflows/probe-google-content.yml \
            .github/workflows/validate-gd3-release.yml \
            .github/workflows/diagnose-openai-brand.yml \
            .github/workflows/diagnose-openai-page-assets.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'webbyLucifer-v3.1-bot'
          git config user.email 'webby-v31-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'NO_CLEANUP_CHANGES'
            exit 0
          fi
          git commit -m 'webby(v3.1): remove stale pre-v3.1 active metadata'
          git push origin HEAD:chatgpt/webby-v3.1-implementation-ready
