name: Materialize v3.1 Vector Assets

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/materialize-v31-vectors.yml'

permissions:
  contents: write

jobs:
  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned vector sources in temp workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-v31-vectors
          mkdir -p tmp-v31-vectors
          cd tmp-v31-vectors
          printf '{"name":"webby-v31-vector-materializer","private":true,"type":"module"}\n' > package.json
          npm install --no-save --ignore-scripts \
            lucide-static@1.28.0 \
            simple-icons@16.27.1 \
            simple-icons-v15@npm:simple-icons@15.22.0 \
            simple-icons-v13@npm:simple-icons@13.21.0
      - name: Export 40 Lucide SVG files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/production/vectors/ui
          pairs=(
            'menu:menu' 'close:x' 'chevron-down:chevron-down' 'chevron-right:chevron-right' 'arrow-right:arrow-right' 'arrow-left:arrow-left'
            'external-link:external-link' 'check:check' 'circle-check:circle-check' 'circle-alert:circle-alert' 'star:star' 'user:user' 'users:users'
            'briefcase:briefcase' 'shield-check:shield-check' 'percent:percent' 'globe:globe' 'messages-square:messages-square' 'package:package'
            'badge-check:badge-check' 'clock:clock' 'calendar:calendar' 'target:target' 'mail:mail' 'phone:phone' 'map-pin:map-pin' 'send:send'
            'monitor-smartphone:monitor-smartphone' 'building:building' 'code:code' 'palette:palette' 'headset:headset' 'shopping-bag:shopping-bag'
            'credit-card:credit-card' 'lightbulb:lightbulb' 'search:search' 'filter:filter' 'lock-keyhole:lock-keyhole' 'sparkles:sparkles' 'award:award'
          )
          for pair in "${pairs[@]}"; do
            id="${pair%%:*}"
            source_name="${pair##*:}"
            src="tmp-v31-vectors/node_modules/lucide-static/icons/${source_name}.svg"
            test -f "$src" || { echo "MISSING_LUCIDE_ICON id=$id source=$source_name"; exit 1; }
            cp "$src" "assets/production/vectors/ui/icon-${id}.svg"
          done
          test "$(find assets/production/vectors/ui -maxdepth 1 -type f -name 'icon-*.svg' | wc -l)" -eq 40
      - name: Export 7 current + Canva + OpenAI pinned vector marks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/production/vectors/brands
          cd tmp-v31-vectors
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import * as current from 'simple-icons';
          import * as v15 from 'simple-icons-v15';
          import * as v13 from 'simple-icons-v13';
          const sets = [
            ['simple-icons@16.27.1', current, {
              'brand-facebook':'siFacebook','brand-tiktok':'siTiktok','brand-meta':'siMeta','brand-youtube':'siYoutube',
              'brand-zalo':'siZalo','brand-messenger':'siMessenger','brand-telegram':'siTelegram'
            }],
            ['simple-icons@15.22.0', v15, {'brand-canva':'siCanva'}],
            ['simple-icons@13.21.0', v13, {'brand-openai-chatgpt':'siOpenai'}]
          ];
          const meta = {};
          for (const [version, source, wanted] of sets) {
            for (const [id, exportName] of Object.entries(wanted)) {
              const icon = source[exportName];
              if (!icon || !icon.svg) {
                console.error(`MISSING_PINNED_BRAND id=${id} export=${exportName} version=${version}`);
                process.exit(1);
              }
              const svg = icon.svg.replace('<svg ', '<svg aria-hidden="true" focusable="false" ');
              fs.writeFileSync(`../assets/production/vectors/brands/${id}.svg`, svg + '\n');
              meta[id] = {exportName,title:icon.title,slug:icon.slug,hex:icon.hex,sourceVersion:version};
            }
          }
          fs.writeFileSync('../.webby/BRAND_VECTOR_METADATA.json', JSON.stringify({
            schemaVersion:1,
            protocolVersion:'3.1.0',
            usageGuidelineAuthority:{openai:'https://openai.com/brand/'},
            sources:['simple-icons@16.27.1','simple-icons@15.22.0','simple-icons@13.21.0'],
            assets:meta
          }, null, 2) + '\n');
          NODE
          cd ..
          test "$(find assets/production/vectors/brands -maxdepth 1 -type f -name 'brand-*.svg' | wc -l)" -eq 9
      - name: Fetch exact official Microsoft logo SVG
        shell: bash
        run: |
          set -euo pipefail
          url='https://learn.microsoft.com/el-gr/entra/identity-platform/media/howto-add-branding-in-apps/ms-symbollockup_mssymbol_19.svg'
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output assets/production/vectors/brands/brand-microsoft.svg
          grep -qi '<svg' assets/production/vectors/brands/brand-microsoft.svg
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.webby/BRAND_VECTOR_METADATA.json')
          d=json.loads(p.read_text())
          d['sources'].append('Microsoft official Learn SVG')
          d['assets']['brand-microsoft']={'title':'Microsoft official logo','sourceVersion':'Microsoft Learn downloadable SVG','sourceUrl':'https://learn.microsoft.com/el-gr/entra/identity-platform/media/howto-add-branding-in-apps/ms-symbollockup_mssymbol_19.svg','selectionPolicy':'official downloadable Microsoft logo SVG; copied byte-for-byte'}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          test "$(find assets/production/vectors/brands -maxdepth 1 -type f -name 'brand-*.svg' | wc -l)" -eq 10
      - name: Write vector source lock and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > .webby/VECTOR_SOURCE_LOCK.json <<'JSON'
          {
            "schemaVersion":1,
            "protocolVersion":"3.1.0",
            "status":"MATERIALIZED",
            "genericIcons":{"source":"lucide-static","version":"1.28.0","count":40,"destinationRoot":"assets/production/vectors/ui"},
            "brandMarks":{
              "count":10,
              "sources":[
                {"source":"simple-icons","version":"16.27.1","count":7},
                {"source":"simple-icons","version":"15.22.0","count":1,"asset":"Canva"},
                {"source":"simple-icons","version":"13.21.0","count":1,"asset":"OpenAI","usageGuidelineAuthority":"https://openai.com/brand/"},
                {"source":"Microsoft official Learn SVG","count":1}
              ],
              "destinationRoot":"assets/production/vectors/brands"
            },
            "runtimePolicy":"PROJECT_PATH",
            "claudeMaySubstitute":false
          }
          JSON
          find assets/production/vectors -type f -name '*.svg' -print0 | sort -z | xargs -0 sha256sum > .webby/VECTOR_SHA256SUMS.txt
          test "$(wc -l < .webby/VECTOR_SHA256SUMS.txt)" -eq 50
      - name: Commit verified vector assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-v31-vectors
          git config user.name 'webbyLucifer-v3.1-bot'
          git config user.email 'webby-v31-bot@users.noreply.github.com'
          git add assets/production/vectors .webby/VECTOR_SOURCE_LOCK.json .webby/VECTOR_SHA256SUMS.txt .webby/BRAND_VECTOR_METADATA.json
          if git diff --cached --quiet; then
            echo 'NO_VECTOR_CHANGES'
            exit 0
          fi
          git commit -m 'webby(v3.1): add 50 pinned production vector assets'
          git push origin HEAD:chatgpt/webby-v3.1-implementation-ready
