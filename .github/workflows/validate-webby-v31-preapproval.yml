name: Validate webbyLucifer v3.1 Pre-Approval

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/validate-webby-v31-preapproval.yml'
      - '.webby/HANDOFF.json'
      - '.webby/WEBBY_LOCK.json'
      - '.webby/asset-manifest.json'
      - '.webby/ASSET_COUNT_PLAN.json'
      - '.webby/PROJECT_INTAKE.json'
      - '.webby/ICON_INVENTORY_PLAN.json'

permissions:
  contents: read

jobs:
  canonical-v31:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0
      - name: Fetch exact canonical validator b805dfd
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/th6322750-stack/webbyLucifer/b805dfdab336ff3942c68bb0e20a9edb0a047a18/scripts/webby-validate.py' \
            -o /tmp/webby-validate.py
          sha256sum /tmp/webby-validate.py
      - name: Run canonical v3.1 semantic validator
        run: python /tmp/webby-validate.py .
      - name: Verify asset-production evidence independently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('.webby/asset-manifest.json').read_text())
          h=json.loads(Path('.webby/HANDOFF.json').read_text())
          assert h['protocolVersion']=='3.1.0' and h['taskMode']=='NEW_REDESIGN'
          assert h['status']=='VISUAL_DIRECTION_APPROVED'
          assert h['assetReview']['status']=='AWAITING_USER_APPROVAL'
          assert h['implementationReady']['assetsComplete'] is True
          assert h['implementationReady']['highResMastersPass'] is True
          assert h['implementationReady']['deliveryComplete'] is True
          assert h['implementationReady']['mappingComplete'] is True
          assert h['implementationReady']['iconInventoryComplete'] is True
          assert h['implementationReady']['assetIntegratedVisualApproved'] is False
          assert len(m['assets'])==84 and len(m['iconInventory'])==40
          assert m['assetStore']['transportMode']=='GIT'
          print('PASS_V31_PREAPPROVAL_ASSET_COMPLETE_AWAITING_USER')
          PY
