    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/validate-webby-v31-preapproval.yml'

permissions:
  contents: read

jobs:
  candidate-v31:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0
      - name: Baseline hold
        run: |
          echo 'Validator trigger narrowed during atomic user-approval promotion.'
          echo 'Current implementation authorization remains governed by .webby/UI_SETUP_COMPLETE.'
