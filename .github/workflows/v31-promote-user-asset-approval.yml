name: Promote webby v3.1 User Asset Approval

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/v31-promote-user-asset-approval.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0

      - name: Verify preapproval baseline and promote candidate atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          APPROVAL='DUYỆT ASSET V3.1'
          APPROVED_AT='2026-08-17T10:43:00+07:00'
          BRANCH='chatgpt/webby-v3.1-implementation-ready'
          CANONICAL='b805dfdab336ff3942c68bb0e20a9edb0a047a18'

          marker=Path('.webby/UI_SETUP_COMPLETE').read_text()
          assert 'UI_SETUP_COMPLETE=false' in marker
          assert 'implementationAuthorized=false' in marker
          assert 'assetIntegratedApproval=PENDING' in marker

          h=json.loads(Path('.webby/HANDOFF.json').read_text())
          assert h['protocolVersion']=='3.1.0'
          assert h['taskMode']=='NEW_REDESIGN'
          assert h['status']=='ASSET_COMPLETE_AWAITING_USER_APPROVAL'
          assert h['assetPlan']['logicalAssetCount']==84
          assert h['assetReview']['status']=='AWAITING_USER_APPROVAL'
          assert h['implementationReady']['assetIntegratedVisualApproved'] is False

          lock=json.loads(Path('.webby/WEBBY_LOCK.json').read_text())
          assert lock['canonicalSkillCommit']==CANONICAL
          assert lock['assetAuthority']['logicalAssetCount']==84
          assert lock['transport']['mode']=='GIT'
          assert lock['transport']['implementationRequiresGoogleDrive'] is False

          receipt={
            'schemaVersion':1,
            'protocolVersion':'3.1.0',
            'projectId':'lacvietmedia-web',
            'branch':BRANCH,
            'approvalType':'ASSET_INTEGRATED_VISUAL_APPROVAL',
            'status':'USER_APPROVED_FINAL',
            'statement':APPROVAL,
            'approvedAt':APPROVED_AT,
            'source':'CHAT_CONVERSATION',
            'logicalAssetCount':84,
            'assetReviewBoard':'ASSET_REVIEW_BOARD_V31.md',
            'assetManifest':'.webby/asset-manifest.json',
            'runtimeRoot':'public/assets',
            'transportMode':'GIT',
            'implementationRequiresGoogleDrive':False,
            'scope':'Approves the integrated v3.1 asset set for implementation against the already-approved V1 layout/hierarchy. Does not authorize redesign or asset substitution.',
            'canonicalSkillCommit':CANONICAL
          }
          Path('.webby/USER_ASSET_APPROVAL_V31.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')

          h['status']='IMPLEMENTATION_READY_UI'
          h['assetReview']['status']='USER_APPROVED_FINAL'
          h['assetReview']['approvalStatement']=APPROVAL
          h['assetReview']['approvalReceipt']='.webby/USER_ASSET_APPROVAL_V31.json'
          h['assetReview']['approvedAt']=APPROVED_AT
          h['implementationReady']['assetIntegratedVisualApproved']=True
          h['validation']['finalReadyValidator']='PENDING_CANDIDATE_VALIDATION'
          h['implementationAuthorization']={
            'status':'BLOCKED_PENDING_CANDIDATE_AND_RELEASE_VALIDATION',
            'authorized':False,
            'rule':'Do not start GĐ9 until UI_SETUP_COMPLETE=true, implementationAuthorized=true, and the final release workflow succeeds on the exact latest remote HEAD.'
          }
          Path('.webby/HANDOFF.json').write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n')

          lock['status']='IMPLEMENTATION_READY_UI_CANDIDATE'
          lock['userAssetApproval']={
            'status':'USER_APPROVED_FINAL',
            'statement':APPROVAL,
            'receipt':'.webby/USER_ASSET_APPROVAL_V31.json',
            'approvedAt':APPROVED_AT
          }
          lock['implementationAuthorized']=False
          lock['finalReadyValidation']='PENDING_CANDIDATE_VALIDATION'
          Path('.webby/WEBBY_LOCK.json').write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          state=Path('.webby/PROJECT_STATE.yaml').read_text()
          state=state.replace('  status: AWAITING_USER_ASSET_INTEGRATED_APPROVAL','  status: IMPLEMENTATION_READY_UI_CANDIDATE')
          state=state.replace('  assetIntegratedUserApproval: PENDING','  assetIntegratedUserApproval: PASS_USER_APPROVED_FINAL')
          state=state.replace('  status: BLOCKED\n  authorized: false\n  reason: USER_ASSET_V3_1_APPROVAL_AND_FINAL_IMPLEMENTATION_READY_VALIDATION_PENDING','  status: BLOCKED_PENDING_FINAL_VALIDATION\n  authorized: false\n  reason: USER_ASSET_APPROVAL_RECORDED; CANDIDATE_AND_RELEASE_VALIDATION_PENDING')
          state=state.replace('  - user reviews ASSET_REVIEW_BOARD_V31.md and approves the integrated v3.1 asset set\n  - record the user asset approval receipt\n  - set handoff status to IMPLEMENTATION_READY_UI only after approval\n','')
          if 'userAssetApproval:' not in state:
            state += '\nuserAssetApproval:\n  status: USER_APPROVED_FINAL\n  statement: "DUYỆT ASSET V3.1"\n  receipt: .webby/USER_ASSET_APPROVAL_V31.json\n  approvedAt: 2026-08-17T10:43:00+07:00\n'
          Path('.webby/PROJECT_STATE.yaml').write_text(state)

          Path('.webby/UI_SETUP_COMPLETE').write_text('''UI_SETUP_COMPLETE=false
implementationAuthorized=false
branch=chatgpt/webby-v3.1-implementation-ready
handoffId=lacvietmedia-webby-v3.1-migration
protocolVersion=3.1.0
taskMode=NEW_REDESIGN
migrationStatus=IMPLEMENTATION_READY_UI_CANDIDATE
userApprovalStatus=USER_APPROVED_FINAL_V1_BASELINE
userApprovalStatement=DUYỆT GIAO DIỆN V1
assetIntegratedApproval=USER_APPROVED_FINAL
assetIntegratedApprovalStatement=DUYỆT ASSET V3.1
assetIntegratedApprovalReceipt=.webby/USER_ASSET_APPROVAL_V31.json
approvedPdf=.webby/visual-master/gd1-v1/LacVietMedia_GD1_UI_Approved_v1.pdf
approvedPdfSha256=f015b20da10eb50862eec6bc9acc7668c02cd2746e31f29bdd73596319b60c4f
logicalAssetCount=84
assetManifest=.webby/asset-manifest.json
runtimeAssetRoot=public/assets
transportMode=GIT
implementationRequiresGoogleDrive=false
canonicalPreapprovalValidator=PASS
candidateReadyValidator=PENDING
finalReleaseValidator=PENDING
blockers=CANDIDATE_AND_FINAL_RELEASE_VALIDATION
nextGate=canonical candidate validation on exact remote HEAD, then authorization promotion, then final release validation on marker-true exact remote HEAD
''')

          claude=Path('.webby/CLAUDE_TASK.md').read_text()
          header='''# CLAUDE TASK — webbyLucifer v3.1 GĐ9 Implementation\n\n**CURRENT STATUS: BLOCKED PENDING FINAL RELEASE VALIDATION.**\n\nUser asset approval `DUYỆT ASSET V3.1` is recorded at `.webby/USER_ASSET_APPROVAL_V31.json`. Do **not** code until `.webby/UI_SETUP_COMPLETE` says both `UI_SETUP_COMPLETE=true` and `implementationAuthorized=true`, and ChatGPT supplies a validated final HEAD whose release workflow succeeded.\n\n'''
          # Remove a previous leading title/status block while preserving detailed implementation contract below.
          if claude.startswith('# '):
            parts=claude.split('\n\n',2)
            claude=parts[2] if len(parts)>=3 else claude
          Path('.webby/CLAUDE_TASK.md').write_text(header+claude)

          mig=json.loads(Path('.webby/V3_1_MIGRATION_AUDIT.json').read_text())
          mig['auditStatus']='USER_ASSET_APPROVED_IMPLEMENTATION_READY_UI_CANDIDATE'
          mig['userAssetApproval']={'status':'USER_APPROVED_FINAL','statement':APPROVAL,'receipt':'.webby/USER_ASSET_APPROVAL_V31.json','approvedAt':APPROVED_AT}
          mig['v31GateAudit']['implementationReadyUi']='CANDIDATE_PENDING_VALIDATION'
          mig['v31GateAudit']['onlyRemainingGate']='CANDIDATE_VALIDATION_THEN_MARKER_TRUE_FINAL_RELEASE_VALIDATION'
          mig['nextGateWork']=[
            'run canonical v3.1 candidate validator on exact latest remote HEAD',
            'if PASS, atomically set UI_SETUP_COMPLETE=true and implementationAuthorized=true',
            'run final release validation on that exact marker-true latest remote HEAD',
            'only then hand GĐ9 to Claude'
          ]
          Path('.webby/V3_1_MIGRATION_AUDIT.json').write_text(json.dumps(mig,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit candidate promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'webbyLucifer-v3.1-bot'
          git config user.email 'webby-v31-bot@users.noreply.github.com'
          git add .webby/USER_ASSET_APPROVAL_V31.json .webby/HANDOFF.json .webby/WEBBY_LOCK.json .webby/PROJECT_STATE.yaml .webby/UI_SETUP_COMPLETE .webby/CLAUDE_TASK.md .webby/V3_1_MIGRATION_AUDIT.json
          git commit -m 'webby(v3.1): record user asset approval and stage implementation-ready candidate'
          git push origin HEAD:chatgpt/webby-v3.1-implementation-ready
