name: Build v3.1 Asset Manifest

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - 'scripts/build-v31-asset-manifest.py'
      - '.github/workflows/build-v31-asset-manifest.yml'

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0
      - name: Build runtime copies + manifest
        run: python scripts/build-v31-asset-manifest.py
      - name: Verify exact counts and runtime paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          m=json.loads(Path('.webby/asset-manifest.json').read_text())
          assert m['version']==3 and m['protocolVersion']=='3.1.0'
          assert m['assetStore']['transportMode']=='GIT'
          assert m['assetStore']['accessProofStatus']=='NOT_REQUIRED'
          assert len(m['assets'])==84
          assert len(m['iconInventory'])==40
          assert all(x['required'] is True for x in m['iconInventory'])
          role_counts={}
          for a in m['assets']:
              role_counts[a['role']]=role_counts.get(a['role'],0)+1
              for d in a['delivery']:
                  p=root/d['destinationPath']
                  assert p.exists(), p
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  assert h==d['sha256'], (p,h,d['sha256'])
          assert role_counts['ICON']==40
          assert sum(1 for a in m['assets'] if a['classification']=='AUTHENTIC' and a['role']=='LOGO')==10
          assert sum(1 for a in m['assets'] if a['role']=='HERO')==7
          assert sum(1 for a in m['assets'] if a['role']=='PROJECT_COVER')==12
          assert sum(1 for a in m['assets'] if a['role']=='NEWS_COVER')==7
          assert sum(1 for a in m['assets'] if a['role']=='AVATAR')==4
          print('PASS_MANIFEST_REMOTE_RUNTIME_COUNTS',role_counts)
          PY
          test "$(find public/assets/icons -type f -name '*.svg' | wc -l)" -eq 40
          test "$(find public/assets/brands -type f -name '*.svg' | wc -l)" -eq 10
          test "$(find public/assets -type f | wc -l)" -eq 84
      - name: Commit runtime asset tree and v3.1 manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'webbyLucifer-v3.1-bot'
          git config user.email 'webby-v31-bot@users.noreply.github.com'
          git add public/assets .webby/asset-manifest.json .webby/ASSET_USAGE_MAP.json
          if git diff --cached --quiet; then
            echo NO_MANIFEST_CHANGES
            exit 0
          fi
          git commit -m 'webby(v3.1): materialize 84 runtime assets and canonical manifest'
          git push origin HEAD:chatgpt/webby-v3.1-implementation-ready
