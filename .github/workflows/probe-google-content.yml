name: Probe Google Transfer Content
on:
  push:
    branches: [chatgpt/gd3-git-self-contained-v1]
    paths: ['.github/workflows/probe-google-content.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Download transfer asset
        shell: bash
        run: |
          set -euo pipefail
          URL='https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfX2eWXlB-vFUQNrwCfSybfV007IqSvKlsRfU8CjmRs3WRjvJdA6IY-dLkUX8cMG8eViuNPN4R8gEv5wxLt3JsDpqPHIdrHYqdwW_4ija7NOQPrb-zUJ0paq3HT5m41Q-GAYeZ9vIRqoj0vd3_4REAWPFmBqUEiP-9vnlTrIKbOzWHvxSo=s2048?key=KG1VlTvQYtb00rwJgVPdmw'
          curl -L --fail --retry 3 --silent --show-error "$URL" -o /tmp/probe.png
          file /tmp/probe.png
          stat -c '%s bytes' /tmp/probe.png
          sha256sum /tmp/probe.png
