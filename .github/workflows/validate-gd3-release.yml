name: Validate GD3 Release Gate
on:
  push:
    branches: [chatgpt/gd3-git-self-contained-v1]
    paths:
      - '.github/workflows/validate-gd3-release.yml'
      - '.webby/UI_SETUP_COMPLETE'
      - '.webby/PROJECT_STATE.yaml'
      - '.webby/HANDOFF.json'
      - '.webby/WEBBY_LOCK.json'
      - '.webby/CLAUDE_TASK.md'
      - '.webby/qa/GD3_GIT_SELF_CONTAINED_VALIDATION.json'
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/gd3-git-self-contained-v1
          fetch-depth: 0
      - name: Verify Git object database
        run: git fsck --full
      - name: Verify no-network clone sufficiency
        run: python scripts/reconstruct-git-self-contained.py
      - name: Verify final authorization state and all hashes
        run: python scripts/validate-gd3-git-self-contained.py --require-ready
      - name: Release summary
        shell: bash
        run: |
          set -euo pipefail
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          grep '^UI_SETUP_COMPLETE=true$' .webby/UI_SETUP_COMPLETE
          grep '^implementationAuthorized=true$' .webby/UI_SETUP_COMPLETE
          grep '^implementationRequiresGoogleDrive=false$' .webby/UI_SETUP_COMPLETE
          test "$(find .webby/visual-master/gd1-v1/pages -name 'page-*.webp' -type f | wc -l)" -eq 14
          test "$(find assets/production -name '*.webp' -type f | wc -l)" -eq 23
          test -f assets/production/brand/lac-viet-logo-source.png
          sha256sum .webby/visual-master/gd1-v1/LacVietMedia_GD1_UI_Approved_v1.pdf
          sha256sum assets/production/brand/lac-viet-logo-source.png
