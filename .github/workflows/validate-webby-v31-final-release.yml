name: Validate webbyLucifer v3.1 Final Release Closure

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/validate-webby-v31-final-release.yml'

permissions:
  contents: read

jobs:
  final-release-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0

      - name: Confirm exact triggering remote HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "trigger_sha=${GITHUB_SHA}"
          echo "checkout_sha=${actual}"
          test "$actual" = "$GITHUB_SHA"

      - name: Verify Git object database
        run: git fsck --full

      - name: Fetch exact canonical validator b805dfd
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/th6322750-stack/webbyLucifer/b805dfdab336ff3942c68bb0e20a9edb0a047a18/scripts/webby-validate.py' -o /tmp/webby-validate.py
          echo 'CANONICAL_VALIDATOR_SOURCE_COMMIT=b805dfdab336ff3942c68bb0e20a9edb0a047a18'
          sha256sum /tmp/webby-validate.py

      - name: Run canonical webbyLucifer v3.1 validator
        run: python /tmp/webby-validate.py .

      - name: Verify closed release authority and all runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re
          CANONICAL='b805dfdab336ff3942c68bb0e20a9edb0a047a18'
          BRANCH='chatgpt/webby-v3.1-implementation-ready'
          h=json.loads(Path('.webby/HANDOFF.json').read_text())
          lock=json.loads(Path('.webby/WEBBY_LOCK.json').read_text())
          release=json.loads(Path('.webby/FINAL_RELEASE_RECEIPT.json').read_text())
          asset_approval=json.loads(Path('.webby/USER_ASSET_APPROVAL_V31.json').read_text())
          visual=json.loads(Path('.webby/USER_VISUAL_APPROVAL.json').read_text())
          manifest=json.loads(Path('.webby/asset-manifest.json').read_text())
          authority=json.loads(Path('.webby/MASTER_BINARY_AUTHORITY.json').read_text())
          drive=json.loads(Path('.webby/ASSET_DRIVE_AUTHORITY.json').read_text())
          audit=json.loads(Path('.webby/V3_1_MIGRATION_AUDIT.json').read_text())
          marker=Path('.webby/UI_SETUP_COMPLETE').read_text()
          project=Path('.webby/PROJECT_STATE.yaml').read_text()
          claude=Path('.webby/CLAUDE_TASK.md').read_text()

          assert visual['approvalStatement']=='DUYỆT GIAO DIỆN V1'
          assert visual['status']=='USER_APPROVED_FINAL'
          assert asset_approval['statement']=='DUYỆT ASSET V3.1'
          assert asset_approval['status']=='USER_APPROVED_FINAL'

          assert release['status']=='PASS'
          assert release['runId']==31992604636
          assert release['validatedHead']=='17bfcae8f3b4892dd7c91eea126200e84ed8b9f3'
          assert release['canonicalSkillCommit']==CANONICAL
          assert release['runtimeSha256']=='PASS_84_OF_84'
          assert release['transportMode']=='GIT'
          assert release['implementationRequiresGoogleDrive'] is False

          assert h['protocolVersion']=='3.1.0'
          assert h['taskMode']=='NEW_REDESIGN'
          assert h['status']=='IMPLEMENTATION_READY_UI'
          assert h['validation']['finalReadyValidator']=='PASS'
          assert h['validation']['finalReleaseRunId']==31992604636
          assert h['validation']['finalReleaseReceipt']=='.webby/FINAL_RELEASE_RECEIPT.json'
          assert h['implementationAuthorization']['status']=='AUTHORIZED_FINAL_RELEASE_PASS'
          assert h['implementationAuthorization']['authorized'] is True
          assert h['implementationAuthorization']['releaseHold'] is False
          for key in ['userVisualApproved','assetIntegratedVisualApproved','assetCountReported','assetsComplete','highResMastersPass','deliveryComplete','transportReadyForSession','mappingComplete','iconInventoryComplete','layoutModeLocked','typographyLocked','semanticGeometryLocked','responsiveLocked','statesLockedOrNA','motionFeelLockedOrNA','noBlockingSpecOrAssetGap']:
            assert h['implementationReady'][key] is True, key

          assert lock['skillVersion']=='3.1.0'
          assert lock['canonicalSkillCommit']==CANONICAL
          assert lock['status']=='LOCKED_IMPLEMENTATION_READY_UI'
          assert lock['validation']['finalImplementationReady']=='PASS'
          assert lock['validation']['finalReleaseRunId']==31992604636
          assert lock['implementationAuthorized'] is True
          assert lock['releaseHold'] is False
          assert lock['assetAuthority']['logicalAssetCount']==84
          assert lock['transport']['mode']=='GIT'
          assert lock['transport']['implementationRequiresGoogleDrive'] is False

          assert 'UI_SETUP_COMPLETE=true' in marker
          assert 'implementationAuthorized=true' in marker
          assert 'releaseHold=false' in marker
          assert 'finalReleaseValidator=PASS' in marker
          assert 'finalReleaseRunId=31992604636' in marker
          assert 'finalReleaseReceipt=.webby/FINAL_RELEASE_RECEIPT.json' in marker
          assert 'blockers=NONE' in marker
          assert 'transportMode=GIT' in marker
          assert 'implementationRequiresGoogleDrive=false' in marker

          assert 'status: IMPLEMENTATION_READY_UI' in project
          assert 'finalReleaseValidator: PASS' in project
          assert 'finalReleaseRunId: 31992604636' in project
          assert 'status: AUTHORIZED_FINAL_RELEASE_PASS' in project
          assert 'authorized: true' in project
          assert 'releaseHold: false' in project

          assert audit['auditStatus']=='IMPLEMENTATION_READY_UI_FINAL_RELEASE_PASS'
          assert audit['v31GateAudit']['finalReleaseHold'] is False
          assert audit['v31GateAudit']['finalReleaseValidator']=='PASS'
          assert audit['v31GateAudit']['finalReleaseRunId']==31992604636

          assert f'Handoff branch: `{BRANCH}`' in claude
          assert '84 assets' in claude
          assert 'GĐ9 — Implementation' in claude
          assert 'Google Drive is review/archive only' in claude

          assert authority['assetAuthority']['logicalAssetCount']==84
          assert authority['transportMode']=='GIT'
          assert authority['implementationRequiresGoogleDrive'] is False
          assert drive['status']=='DEPRECATED_FOR_IMPLEMENTATION'
          assert drive['transportMode']=='GIT'
          assert drive['implementationRequiresGoogleDrive'] is False
          assert drive['driveSessionProofRequired'] is False

          assert manifest['protocolVersion']=='3.1.0'
          assert manifest['assetStore']['transportMode']=='GIT'
          assert manifest['assetStore']['folderRef'] is None
          assets=manifest['assets']
          assert len(assets)==84
          assert len(manifest['iconInventory'])==40
          ids=set(); paths=set()
          for asset in assets:
            aid=asset['id']
            assert aid not in ids
            ids.add(aid)
            deliveries=asset['delivery']
            assert isinstance(deliveries,list) and len(deliveries)==1
            d=deliveries[0]
            p=Path(d['destinationPath'].lstrip('/'))
            assert p.exists(), (aid,str(p))
            assert str(p) not in paths
            paths.add(str(p))
            assert hashlib.sha256(p.read_bytes()).hexdigest()==d['sha256'], aid
          assert len(ids)==84 and len(paths)==84

          pdf=Path('.webby/visual-master/gd1-v1/LacVietMedia_GD1_UI_Approved_v1.pdf')
          assert hashlib.sha256(pdf.read_bytes()).hexdigest()=='f015b20da10eb50862eec6bc9acc7668c02cd2746e31f29bdd73596319b60c4f'

          active=[Path('.webby/HANDOFF.json'),Path('.webby/WEBBY_LOCK.json'),Path('.webby/PROJECT_STATE.yaml'),Path('.webby/UI_SETUP_COMPLETE'),Path('.webby/PROJECT_INTAKE.json'),Path('.webby/V3_1_MIGRATION_AUDIT.json'),Path('.webby/MASTER_BINARY_AUTHORITY.json'),Path('.webby/ASSET_DRIVE_AUTHORITY.json'),Path('.webby/IMPLEMENTATION_ARTIFACT_PROTOCOL.md'),Path('.webby/CLAUDE_TASK.md')]
          forbidden=['NOT_MIGRATED','INCOMPLETE_METADATA','PARTIALLY_DECLARED_NEEDS_V31_SPLIT','NOT_PROVEN_PER_ASSET']
          bad=[]
          for p in active:
            text=p.read_text(encoding='utf-8')
            for token in forbidden:
              if token in text: bad.append((str(p),token))
            if re.search(r'(?:implementationRequiresGoogleDrive|driveSessionProofRequired)[=:\"\s]+true',text,re.I): bad.append((str(p),'POSITIVE_DRIVE_DEP'))
          assert not bad, bad

          print('PASS_V31_FINAL_RELEASE_CLOSURE')
          print('current_verified_head='+str(__import__('os').environ.get('GITHUB_SHA','')))
          print('prior_release_run=31992604636')
          print('logical_assets=84')
          print('runtime_sha256=PASS_84_OF_84')
          print('releaseHold=false')
          print('blockers=NONE')
          print('transport=GIT')
          print('drive_dependency=false')
          print('CLAUDE_GD9_READY=true')
          PY
