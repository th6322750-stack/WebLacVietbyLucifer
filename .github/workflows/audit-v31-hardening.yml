name: Audit webby v3.1 Active Authority

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/audit-v31-hardening.yml'
      - '.webby/**'
      - 'scripts/build-v31-asset-manifest.py'
      - 'scripts/build-v31-asset-manifest-legacy84.py'
      - 'scripts/extract-gd10-approved-pdf-assets.py'
      - 'assets/production/masters/raster/client-logos/**'
      - 'assets/production/delivery/raster/client-logos/**'
      - 'public/assets/client-logos/**'

permissions:
  contents: read

jobs:
  active-authority-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0

      - name: Confirm exact triggering HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Fetch exact canonical validator
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/th6322750-stack/webbyLucifer/b805dfdab336ff3942c68bb0e20a9edb0a047a18/scripts/webby-validate.py' \
            -o /tmp/webby-validate.py
          python /tmp/webby-validate.py .

      - name: Audit active authority invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          ROOT=Path('.')
          PDF_SHA='f015b20da10eb50862eec6bc9acc7668c02cd2746e31f29bdd73596319b60c4f'
          STRIP_SHA='a398f0f6002f3c71f13770c3cdcf9854f14887ff2cf2acd4fc3c46b59c9d8691'
          receipt=ROOT/'.webby/GD10_AUTHORITY_CORRECTION_RECEIPT.json'
          corrected=receipt.exists()
          expected=85 if corrected else 84

          marker=(ROOT/'.webby/UI_SETUP_COMPLETE').read_text(encoding='utf-8')
          assert 'UI_SETUP_COMPLETE=true' in marker
          assert 'implementationAuthorized=true' in marker
          assert 'releaseHold=false' in marker
          assert f'logicalAssetCount={expected}' in marker
          assert 'transportMode=GIT' in marker
          assert 'implementationRequiresGoogleDrive=false' in marker

          handoff=json.loads((ROOT/'.webby/HANDOFF.json').read_text())
          lock=json.loads((ROOT/'.webby/WEBBY_LOCK.json').read_text())
          manifest=json.loads((ROOT/'.webby/asset-manifest.json').read_text())
          usage=json.loads((ROOT/'.webby/ASSET_USAGE_MAP.json').read_text())
          authority=json.loads((ROOT/'.webby/MASTER_BINARY_AUTHORITY.json').read_text())

          assert handoff['status']=='IMPLEMENTATION_READY_UI'
          assert handoff['implementationAuthorization']['authorized'] is True
          assert handoff['implementationAuthorization']['releaseHold'] is False
          assert handoff['assetPlan']['logicalAssetCount']==expected
          assert lock['assetAuthority']['logicalAssetCount']==expected
          assert authority['assetAuthority']['logicalAssetCount']==expected
          assert manifest['assetStore']['transportMode']=='GIT'
          assert len(manifest['iconInventory'])==40
          assert len(manifest['assets'])==expected

          paths=set(); ids=set()
          for asset in manifest['assets']:
            aid=asset['id']; assert aid not in ids; ids.add(aid)
            delivery=asset['delivery']; assert isinstance(delivery,list) and len(delivery)==1
            d=delivery[0]; p=ROOT/d['destinationPath']
            assert p.exists(), (aid,p)
            assert hashlib.sha256(p.read_bytes()).hexdigest()==d['sha256'], aid
            assert str(p) not in paths; paths.add(str(p))
          assert len(paths)==expected

          pdf=ROOT/'.webby/visual-master/gd1-v1/LacVietMedia_GD1_UI_Approved_v1.pdf'
          assert hashlib.sha256(pdf.read_bytes()).hexdigest()==PDF_SHA

          if corrected:
            assert lock['assetAuthority']['rasterLogicalCount']==35
            assert lock['assetAuthority']['vectorCount']==50
            assert authority['assetAuthority']['rasterLogicalCount']==35
            assert usage['routes']['/support-mxh']['clientLogoStrip']=='support-client-logo-strip'
            assert usage['routes']['/lien-he']['contactIcon']=='icon-mail'
            strip=ROOT/'public/assets/client-logos/support-client-logo-strip.png'
            assert hashlib.sha256(strip.read_bytes()).hexdigest()==STRIP_SHA
            asset=next(x for x in manifest['assets'] if x['id']=='support-client-logo-strip')
            assert asset['classification']=='DEMO'
            assert asset['livePolicy']=='DEMO_ONLY'
            claude=(ROOT/'.webby/CLAUDE_TASK.md').read_text(encoding='utf-8')
            assert '85 assets' in claude
            assert 'GD10 TARGETED FIX' in claude
            assert 'final release hold remains' not in claude
            print('PASS_V31_ACTIVE_AUTHORITY_GD10_CORRECTED')
            print('logical_assets=85 raster=35 vector=50')
            print('support_client_logo_strip_sha='+STRIP_SHA)
            print('contact_channel_fourth=EMAIL_PENDING_DISABLED')
          else:
            assert lock['assetAuthority']['rasterLogicalCount']==34
            assert lock['assetAuthority']['vectorCount']==50
            print('PASS_V31_ACTIVE_AUTHORITY_BASELINE_84')
          PY
