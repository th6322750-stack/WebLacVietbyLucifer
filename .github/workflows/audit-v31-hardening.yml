name: Audit webby v3.1 Hardening

on:
  push:
    branches: [chatgpt/webby-v3.1-implementation-ready]
    paths:
      - '.github/workflows/audit-v31-hardening.yml'
      - '.webby/**'
      - 'DESIGN_SYSTEM.md'

permissions:
  contents: read

jobs:
  stale-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/webby-v3.1-implementation-ready
          fetch-depth: 0

      - name: Whole-tree diagnostic search
        shell: bash
        run: |
          set -euo pipefail
          echo 'Historical pre-v3.1 evidence under .webby/archive/pre-v31 is intentionally excluded from active-authority diagnostics.'
          for label in OLD_BRANCH LEGACY_PHASE STALE_READINESS DRIVE_URL POSITIVE_DRIVE_DEP LEGACY_23_ASSET; do echo "=== $label ==="; done
          grep -RInI --exclude-dir=.git --exclude-dir=archive --exclude='audit-v31-hardening.yml' 'chatgpt/gd3-git-self-contained-v1' . || true
          grep -RInI --exclude-dir=.git --exclude-dir=archive --exclude='audit-v31-hardening.yml' -E 'GĐ4|GĐ5|GĐ6' . || true
          grep -RInI --exclude-dir=.git --exclude-dir=archive --exclude='audit-v31-hardening.yml' -E 'NOT_MIGRATED|INCOMPLETE_METADATA|PARTIALLY_DECLARED_NEEDS_V31_SPLIT|NOT_PROVEN_PER_ASSET' . || true
          grep -RInI --exclude-dir=.git --exclude-dir=archive --exclude='audit-v31-hardening.yml' -E 'drive\.google\.com|docs\.google\.com' . || true
          grep -RInI --exclude-dir=.git --exclude-dir=archive --exclude='audit-v31-hardening.yml' -E 'implementationRequiresGoogleDrive[=:][[:space:]]*true|driveSessionProofRequired[=:][[:space:]]*true' . || true
          grep -RInI --exclude-dir=.git --exclude-dir=archive --exclude='audit-v31-hardening.yml' -E '(^|[^[:alnum:]_])23[[:space:]-]+(asset|assets)|"logicalAssetCount"[[:space:]]*:[[:space:]]*23|"productionAssets"[^\n]*23' . || true

      - name: Strict active-tree and authority invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          archive_root=Path('.webby/archive/pre-v31')
          audit_path=Path('.github/workflows/audit-v31-hardening.yml')
          allowed_drive_url_files={
            Path('.webby/USER_VISUAL_APPROVAL.json'),
            Path('.webby/GD1_PREVIEW.json'),
            Path('.webby/PREVIEW_AUTHORITY.md'),
            Path('.webby/visual-handoff/ui-states.md'),
          }
          stale_tokens=[
            'chatgpt/gd3-git-self-contained-v1',
            'NOT_MIGRATED',
            'INCOMPLETE_METADATA',
            'PARTIALLY_DECLARED_NEEDS_V31_SPLIT',
            'NOT_PROVEN_PER_ASSET',
          ]
          legacy_phase=re.compile(r'GĐ4|GĐ5|GĐ6')
          legacy_23=re.compile(r'\b23\s+(?:asset|assets)\b', re.I)
          drive_url=re.compile(r'https://(?:drive|docs)\.google\.com/', re.I)
          positive_drive=re.compile(r'(?:implementationRequiresGoogleDrive|driveSessionProofRequired)[=:\"\s]+true', re.I)

          violations=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts:
              continue
            if archive_root in p.parents or p==audit_path:
              continue
            try:
              text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError:
              continue
            for token in stale_tokens:
              if token in text:
                violations.append((str(p),'STALE_TOKEN',token))
            if legacy_phase.search(text):
              violations.append((str(p),'LEGACY_PHASE','GĐ4/GĐ5/GĐ6'))
            if legacy_23.search(text):
              violations.append((str(p),'LEGACY_23_ASSET','23 asset claim'))
            if positive_drive.search(text):
              violations.append((str(p),'POSITIVE_DRIVE_DEP','true'))
            if drive_url.search(text) and p not in allowed_drive_url_files:
              violations.append((str(p),'UNEXPECTED_DRIVE_URL','external review URL'))
          if violations:
            raise SystemExit('ACTIVE_TREE_STALE_VIOLATIONS='+repr(violations))

          active = [
            Path('.webby/CLAUDE_TASK.md'), Path('.webby/PROJECT_STATE.yaml'),
            Path('.webby/HANDOFF.json'), Path('.webby/WEBBY_LOCK.json'),
            Path('.webby/UI_SETUP_COMPLETE'), Path('.webby/MASTER_BINARY_AUTHORITY.json'),
            Path('.webby/ASSET_DRIVE_AUTHORITY.json'), Path('.webby/asset-manifest.json'),
            Path('.webby/ASSET_USAGE_MAP.json'), Path('.webby/ICON_INVENTORY_PLAN.json'),
            Path('.webby/MOTION_FEEL_CONTRACT.json'), Path('.webby/PROJECT_INTAKE.json'),
            Path('.webby/V3_1_MIGRATION_AUDIT.json'), Path('.webby/IMPLEMENTATION_ARTIFACT_PROTOCOL.md')
          ]
          for p in active:
            assert p.exists(), f'MISSING_ACTIVE_AUTHORITY {p}'

          marker=Path('.webby/UI_SETUP_COMPLETE').read_text()
          assert 'UI_SETUP_COMPLETE=false' in marker
          assert 'implementationAuthorized=false' in marker
          assert 'logicalAssetCount=84' in marker
          assert 'transportMode=GIT' in marker
          assert 'implementationRequiresGoogleDrive=false' in marker

          handoff=json.loads(Path('.webby/HANDOFF.json').read_text())
          assert handoff['protocolVersion']=='3.1.0'
          assert handoff['status']=='ASSET_COMPLETE_AWAITING_USER_APPROVAL'
          assert handoff['assetPlan']['logicalAssetCount']==84
          ready=handoff['implementationReady']
          for key in ['assetsComplete','highResMastersPass','deliveryComplete','transportReadyForSession','mappingComplete','iconInventoryComplete','layoutModeLocked','typographyLocked','semanticGeometryLocked','responsiveLocked','statesLockedOrNA','motionFeelLockedOrNA','noBlockingSpecOrAssetGap']:
            assert ready[key] is True, (key, ready[key])
          assert ready['assetIntegratedVisualApproved'] is False

          lock=json.loads(Path('.webby/WEBBY_LOCK.json').read_text())
          assert lock['skillVersion']=='3.1.0'
          assert lock['canonicalSkillCommit']=='b805dfdab336ff3942c68bb0e20a9edb0a047a18'
          assert lock['assetAuthority']['logicalAssetCount']==84
          assert lock['transport']['mode']=='GIT'
          assert lock['transport']['implementationRequiresGoogleDrive'] is False

          manifest=json.loads(Path('.webby/asset-manifest.json').read_text())
          assert manifest['protocolVersion']=='3.1.0'
          assert manifest['assetStore']['transportMode']=='GIT'
          assert manifest['assetStore']['folderRef'] is None
          entries=manifest.get('assets') or manifest.get('entries') or manifest.get('items')
          assert isinstance(entries,list), 'MANIFEST_ASSET_LIST_NOT_FOUND'
          assert len(entries)==84, len(entries)
          assert len(manifest.get('iconInventory',[]))==40
          runtime_paths=[]
          for e in entries:
            dest=e.get('destinationPath') or (e.get('delivery') or {}).get('destinationPath')
            assert dest, ('MISSING_DESTINATION_PATH', e.get('id'))
            p=Path(dest.lstrip('/'))
            assert p.exists(), ('MISSING_RUNTIME_ASSET',dest)
            runtime_paths.append(str(p))
          assert len(set(runtime_paths))==84, 'RUNTIME_PATHS_NOT_UNIQUE_84'

          authority=json.loads(Path('.webby/MASTER_BINARY_AUTHORITY.json').read_text())
          assert authority['assetAuthority']['logicalAssetCount']==84
          assert authority['transportMode']=='GIT'
          assert authority['implementationRequiresGoogleDrive'] is False

          claude=Path('.webby/CLAUDE_TASK.md').read_text()
          assert 'chatgpt/webby-v3.1-implementation-ready' in claude
          assert 'GĐ9 — Implementation' in claude
          assert '84 assets' in claude
          assert 'UI_SETUP_COMPLETE=true' in claude

          print('PASS_V31_ACTIVE_TREE_STALE_AUDIT')
          print('manifest_assets=84')
          print('runtime_unique_paths=84')
          print('icon_inventory=40')
          print('transport=GIT')
          print('drive_implementation_dependency=false')
          print('Claude_BLOCKED=true')
          PY
