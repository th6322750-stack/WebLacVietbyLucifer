name: Materialize GĐ3 Self-Contained
on:
  push:
    branches: [chatgpt/gd3-git-self-contained-v1]
    paths:
      - 'scripts/materialize-gd3-pages.sh'
      - 'scripts/materialize-gd3-assets.sh'
      - '.github/workflows/materialize-gd3-self-contained.yml'
permissions:
  contents: write
jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[materialized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: chatgpt/gd3-git-self-contained-v1 }
      - name: Fetch and SHA-verify binary masters/assets
        shell: bash
        run: |
          set -euo pipefail
          grep -v 'lac-viet-logo-source.png' scripts/materialize-gd3-pages.sh > /tmp/pages.sh
          bash /tmp/pages.sh
          bash scripts/materialize-gd3-assets.sh
      - name: Commit verified binaries
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .webby/visual-master/gd1-v1/pages assets/production
          git commit -m '[materialized] GĐ3 Git-resident visual masters and assets'
          git push origin HEAD:chatgpt/gd3-git-self-contained-v1
